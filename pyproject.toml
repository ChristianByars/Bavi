[project]
name = "bavi"
version = "0.1.0"
description = "Super Typhoon Bavi (July 2026): AI-model track, wind and precipitation forecast with NVIDIA Earth2Studio, verified against IBTrACS"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Christian Byars" }]
dependencies = [
    "earth2studio[aifs2,cyclone,data,graphcast,sfno]==0.20.0",
    "torch==2.13.0",
    "cartopy>=0.22.0",
    "gcsfs>=2024.1.0",
    "makani",  # not on PyPI: resolved from [tool.uv.sources] (earth2studio[sfno] needs it; uv ignores a dependency's sources)
    "matplotlib>=3.8.1",
    "numpy>=1.26",
    "nvidia-ml-py",
    "pandas>=2.0.0",
    "pytest>=9.0.3",  # cupy.testing import guard: importing cupy without pytest crashes
    "scipy>=1.10.0",
    "tqdm>=4.65.0",  # the notebook imports tqdm directly (progress bars in the tracker loops)
    "weathernext",  # not on PyPI: resolved from [tool.uv.sources] (earth2studio[graphcast] needs it; uv ignores a dependency's sources)
    "xarray>=2024.10.0",
    "zarr>=2.18.0",
]

[dependency-groups]
dev = ["ipykernel>=7.1.0", "nbconvert>=7.16.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
makani = { git = "https://github.com/NVIDIA/makani.git", rev = "b38fcb2799d7dbc146fa60459f3f9823394a8bf1" }  # same pin as earth2studio 0.20.0
weathernext = { git = "https://github.com/google-deepmind/weathernext.git", rev = "9c034db1ff412d5db6cbe6bb0c5c9afc5a267719" }  # same pin as earth2studio 0.20.0
flash-attn = { path = "wheels/flash_attn-2.8.3-cp312-cp312-linux_x86_64.whl" }
torch-harmonics = { path = "wheels/torch_harmonics-0.8.1-cp312-cp312-linux_x86_64.whl" }

[tool.uv]
index-strategy = "unsafe-best-match"
override-dependencies = ["torch-harmonics==0.8.1", "flash-attn==2.8.3"]
no-build-isolation-package = ["torch-harmonics", "flash-attn"]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch", "packaging", "ninja"]
torch-harmonics = ["torch"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
priority = "supplemental"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
